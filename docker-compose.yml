# Attack Lab · desarrollo LOCAL (no despliegue). Puertos solo en 127.0.0.1.
#   docker compose up --build        → API http://127.0.0.1:8000/health · UI http://127.0.0.1:8501/attack-lab
# Secretos (tokens, claves de modelos) en un .env local NO versionado; ver docs/HANDOFF_DEV3.md.
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_CORS_ORIGINS: "http://localhost:8501,http://127.0.0.1:8501"
    volumes:
      - demo-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    environment:
      API_URL: "http://api:8000"
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  demo-data: {}
