[project]
name = "robale-attack-lab-ui"
version = "0.1.0"
description = "Attack Lab · UI Streamlit (habla con la API por HTTP; no abre la base ni la firma)"
requires-python = ">=3.12,<3.13"
# Proyecto aparte: Streamlit exige pillow<13 y el cerebro/extracción de Dev 1 usan pillow 13.
dependencies = [
    "streamlit>=1.40",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["e2e: usa una API real en ATTACK_LAB_API_URL (se salta si no está definida)"]
