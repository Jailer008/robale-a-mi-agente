# Attack Lab · UI. Tema oscuro para que la cabecera de Streamlit tenga el mismo fondo que la app
# (con el tema claro el texto de la barra quedaba con contraste 1,16:1) y sin el botón «Deploy».
[theme]
base = "dark"
primaryColor = "#8b5cf6"
backgroundColor = "#111827"
secondaryBackgroundColor = "#1f2937"
textColor = "#f3f4f6"

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
